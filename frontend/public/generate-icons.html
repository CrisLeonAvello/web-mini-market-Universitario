<!DOCTYPE html>
<html>
<head>
  <title>PWA Icon Generator</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #0a0e27;
      color: white;
    }
    button {
      background: linear-gradient(135deg, #a855f7, #ff6b35);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      opacity: 0.9;
    }
    #preview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .icon-preview {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
    .icon-preview img {
      max-width: 100%;
      border-radius: 8px;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <h1>🎨 StudiMarket PWA Icon Generator</h1>
  <p>Este generador creará todos los iconos necesarios para la PWA a partir del logo SVG.</p>
  
  <button onclick="generateAllIcons()">✨ Generar Todos los Iconos</button>
  <button onclick="downloadAll()">📥 Descargar Todos</button>
  
  <div id="preview"></div>
  <canvas id="canvas"></canvas>

  <script>
    const sizes = [
      { name: 'pwa-64x64.png', size: 64 },
      { name: 'pwa-192x192.png', size: 192 },
      { name: 'pwa-512x512.png', size: 512 },
      { name: 'maskable-icon-512x512.png', size: 512, padding: 0.1 },
      { name: 'apple-touch-icon.png', size: 180 },
      { name: 'favicon-32x32.png', size: 32 },
      { name: 'favicon-16x16.png', size: 16 }
    ];

    let generatedIcons = {};

    async function generateIcon(name, size, padding = 0) {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = size;
      canvas.height = size;
      
      // Clear canvas
      ctx.clearRect(0, 0, size, size);
      
      // For maskable icons, add safe zone padding
      const actualSize = size * (1 - padding * 2);
      const offset = size * padding;
      
      // Load and draw SVG
      const img = new Image();
      const svgBlob = await fetch('./logo.svg').then(r => r.blob());
      const url = URL.createObjectURL(svgBlob);
      
      return new Promise((resolve) => {
        img.onload = () => {
          ctx.drawImage(img, offset, offset, actualSize, actualSize);
          URL.revokeObjectURL(url);
          
          canvas.toBlob((blob) => {
            generatedIcons[name] = blob;
            resolve(URL.createObjectURL(blob));
          }, 'image/png');
        };
        img.src = url;
      });
    }

    async function generateAllIcons() {
      const preview = document.getElementById('preview');
      preview.innerHTML = '<p>Generando iconos...</p>';
      
      preview.innerHTML = '';
      
      for (const config of sizes) {
        const url = await generateIcon(config.name, config.size, config.padding || 0);
        
        const div = document.createElement('div');
        div.className = 'icon-preview';
        div.innerHTML = `
          <img src="${url}" alt="${config.name}">
          <p><strong>${config.name}</strong></p>
          <p>${config.size}x${config.size}px</p>
          <button onclick="downloadIcon('${config.name}')">Descargar</button>
        `;
        preview.appendChild(div);
      }
      
      alert('✅ Todos los iconos generados! Usa "Descargar Todos" o descarga individualmente.');
    }

    function downloadIcon(name) {
      const blob = generatedIcons[name];
      if (!blob) return;
      
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function downloadAll() {
      if (Object.keys(generatedIcons).length === 0) {
        alert('⚠️ Primero genera los iconos haciendo clic en "Generar Todos los Iconos"');
        return;
      }
      
      for (const name in generatedIcons) {
        setTimeout(() => downloadIcon(name), 100);
      }
    }
  </script>
</body>
</html>
